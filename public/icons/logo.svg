<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Our Wealth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>

    <!-- Knocks the pound sign out of the solid coin so the gradient shows through. -->
    <mask id="coin">
      <circle cx="316" cy="262" r="116" fill="#fff"/>
      <text x="318" y="314" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="168" font-weight="700" fill="#000">£</text>
    </mask>

    <!-- Punches a gap in the back ring where the coin crosses in front. -->
    <mask id="weave">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="316" cy="262" r="140" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- The ring behind: the second of you. -->
  <circle cx="192" cy="262" r="104" fill="none" stroke="#ffffff" stroke-width="36" mask="url(#weave)"/>

  <!-- The coin in front, pound knocked out. -->
  <circle cx="316" cy="262" r="116" fill="#ffffff" mask="url(#coin)"/>
</svg>
