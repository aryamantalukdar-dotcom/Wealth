<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EDEBE4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Our Wealth" />
  <title>Sign in · Our Wealth</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
  <link rel="mask-icon" href="/icons/logo.svg" color="#14140F" />
  <style>
    /* Swiss grid: same tokens as the app, inlined so the sign-in page needs no
       stylesheet round-trip before it can paint. */
    @font-face {
      font-family: 'Archivo';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('/fonts/archivo-latin.woff2') format('woff2');
    }
    :root { --paper: #EDEBE4; --ink: #14140F; --muted: #5B584C; --rule: #C9C5B6; --neg: #B23A1B; }
    * { box-sizing: border-box; }
    html { background: var(--paper); color-scheme: light; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      padding: 32px max(20px, env(safe-area-inset-right)) 32px max(20px, env(safe-area-inset-left));
      background: var(--paper); color: var(--ink);
      font-family: 'Archivo', ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      width: min(360px, 100%);
      background: none;
      border: 0;
      border-top: 1.5px solid var(--ink);
      padding: 26px 0 0;
    }
    .brand { display: block; width: 40px; height: 40px; }
    h1 {
      font-size: 26px; font-weight: 700; letter-spacing: -0.03em;
      margin: 16px 0 26px; color: var(--ink);
    }
    label {
      display: block; margin-bottom: 8px;
      font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase;
      color: var(--muted);
    }
    input {
      width: 100%; padding: 12px; min-height: 44px;
      border: 1px solid var(--rule); border-radius: 0;
      background: #fff; color: var(--ink);
      font-family: inherit; font-size: 16px; outline: none;
      transition: border-color .12s linear, box-shadow .12s linear;
    }
    input:focus { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    button {
      width: 100%; margin-top: 18px; padding: 13px; min-height: 48px;
      border: 1.5px solid var(--ink); border-radius: 0;
      background: var(--ink); color: var(--paper);
      font-family: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background .12s linear, color .12s linear;
    }
    button:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    .err { color: var(--neg); font-size: 13px; margin-top: 12px; min-height: 18px; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <form class="card" id="form">
    <img class="brand" src="/icons/logo.svg" alt="" width="40" height="40" />
    <h1>Our Wealth</h1>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" autofocus />
    <button type="submit" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (r.ok) { window.location = '/'; return; }
        err.textContent = 'Wrong password';
      } catch {
        err.textContent = 'Something went wrong';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
