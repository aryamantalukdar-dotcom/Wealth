<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EDEBE4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Our Wealth" />
  <title>Our Wealth Dashboard</title>
  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Root-absolute so the icons resolve from any route, and real PNGs rather
       than an emoji in an SVG data URI (which many browsers won't rasterise,
       leaving bookmarks and the iOS home screen with a grey letter tile).
       The ?v= suffix is there because bookmark favicons and home-screen tiles
       are cached by URL, outside normal HTTP caching: redrawing the logo under
       the same file names leaves devices showing the old one. Bump it (here,
       in login.html and in manifest.webmanifest) whenever the icons change. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=2" />
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg?v=2" />
  <link rel="mask-icon" href="/icons/logo.svg?v=2" color="#14140F" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/icons/logo.svg" alt="" width="28" height="28" />
      <span class="brand-name">Our Wealth</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="p1">Partner 1</button>
      <button class="tab" data-view="p2">Partner 2</button>
      <button class="tab" data-view="targets">Targets</button>
    </nav>
    <button class="btn-ghost btn-small logout-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">Sign out</button>
  </header>

  <main id="app">
    <div class="loading" id="loadingMsg">Loading…</div>
  </main>

  <nav class="bottomnav" id="bottomnav" aria-label="Sections">
    <button class="tab bnav" data-view="dashboard">
      <span class="bnav-ico"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.2" y="1.2" width="13.6" height="13.6" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="bnav-label">Home</span>
    </button>
    <button class="tab bnav" data-view="p1">
      <span class="bnav-ico avatar av1" data-avatar="p1"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="bnav-label" data-label="p1">Partner 1</span>
    </button>
    <button class="tab bnav" data-view="p2">
      <span class="bnav-ico avatar av2" data-avatar="p2"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.4 14.8 14.6H1.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="bnav-label" data-label="p2">Partner 2</span>
    </button>
    <button class="tab bnav" data-view="targets">
      <span class="bnav-ico"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg></span><span class="bnav-label">Targets</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
